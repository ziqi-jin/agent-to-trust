# Stage 0/1 — Docker Compose
# 用法：docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: acl
      POSTGRES_PASSWORD: acl
      POSTGRES_DB: acl
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 资源限额（2026-09-13，A 档加固）：防单服务跑飞拖垮整机（2 核/3.6G 单点）
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acl -d acl"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192M

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://acl:acl@postgres:5432/acl
      PORT: 8000
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL}
      # S4-B 酒馆证据摄入 bearer（与酒馆仓 .env 同值；实际值 gitignored .env 注入，不提交明文）
      A2T_TRADE_INGEST_TOKEN: ${A2T_TRADE_INGEST_TOKEN:-}
      # 反馈摘要读取令牌（GET /feedback；未设置时接口关闭）
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # T12 准入队列：平台买家密钥持久化（重启不丢，防同名异钥 403）+ solo 等待时长
      PLATFORM_KEY_DIR: /app/data/.acl-platform
      QUEUE_SOLO_WAIT_MS: ${QUEUE_SOLO_WAIT_MS:-12000}
    volumes:
      - aclplatform:/app/data
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 640M
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  dashboard:
    build:
      context: apps/dashboard
      dockerfile: Dockerfile
    environment:
      # 服务端（generateMetadata / RSC）取数走容器网：相对路径 /api 在服务端没有 origin。
      # 客户端仍用 NEXT_PUBLIC_API_URL（/api，同源走 nginx）。
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3001:3001"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    depends_on:
      - api

volumes:
  pgdata:
  aclplatform:
